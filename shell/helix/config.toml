theme = "catppuccin_macchiato"

[editor]
evil = false # Use traditional vim keybinds
line-number = "relative"
color-modes = true
text-width = 120
trim-trailing-whitespace = true
soft-wrap.enable = true

[editor.indent-guides]
render = true
character = "▏" # Some characters that work well: "▏", "╎", "┆", "┊", "⸽"
skip-levels = 1
